<style>
/* Hub has no left column any more (Daria, 26.09): the canvas takes the whole left window, the page and the device
   are picked from two small controls on top of it. */
.hub-center { position: relative; flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--color-bg-secondary); }   /* white: the gray is the backdrop behind the windows */
/* The hub fills the whole left window, no white margins (Daria, 26.09). Desktop is a real 1280px page scaled to the
   window's width — its proportions stay (Daria: it was stretching); Phone and Tablet are scaled up to the window's
   width (up to 1.5×) in the middle of a quiet grey field — Secondary Alt from the kit (Daria, 27.09). */
.canvas { position: relative; flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; }   /* relative: the field next to the element scrolls with the hub */
.canvas--framed { padding: 24px 24px 104px; }
#stage { flex: 1 0 auto; display: flex; flex-direction: column; }
/* page and device: a small floating bar at the bottom centre, over the hub (Readymag's toolbar as the reference) */
.hub-tools { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 25; display: flex; align-items: center; gap: 4px; padding: 4px;
  border-radius: var(--radius-xl); border: 1px solid var(--color-border-secondary); background: var(--color-fg-primary); box-shadow: var(--shadow-lg); }
.hub-tools .dd__menu { top: auto; bottom: calc(100% + 10px); }   /* the bar sits at the bottom: menus open upwards */
.hub-pick { height: 36px; min-width: 176px; padding: 0 10px 0 12px; gap: 8px; }
.hub-pick > span { flex: 1; }
.hub-dev { width: 36px; height: 36px; border-color: transparent; box-shadow: none; }
.hub-dev svg { width: 18px; height: 18px; }
/* Newton's quick actions live in the bar as icons (Daria, 26.09 — they came out of the chat): each has a tooltip,
   the one Newton recommends carries his gradient dot, a pressed one (Store first, Keep this one) is tinted */
.tool-sep { width: 1px; height: 22px; margin: 0 4px; background: var(--color-border-secondary); }
.tool { position: relative; width: 36px; height: 36px; flex-shrink: 0; display: grid; place-items: center; border: 0; border-radius: var(--radius-lg); background: none; color: var(--color-text-secondary); cursor: pointer; }
.tool svg { width: 18px; height: 18px; }
.tool:hover { background: var(--color-fg-primary-hover); color: var(--color-text-primary); }
.tool[aria-pressed="true"] { background: var(--color-fg-secondary-alt); color: var(--color-text-primary); }   /* pressed: the kit's grey, no blue in buttons (Daria, 27.09) */
.tool[aria-disabled="true"] { cursor: default; }
.tool[aria-disabled="true"]:not([aria-pressed="true"]) { color: var(--color-text-quarterary); background: none; }
.tool--ai { background: var(--ai-surface); }
.tool--ai .ai-ico { width: 18px; height: 18px; }
.tool--ai:hover { background: var(--ai-surface); filter: saturate(1.3); }
.tool--ai[aria-disabled="true"] { background: none; filter: none; }
.tool--ai[aria-disabled="true"] .ai-ico { color: var(--color-text-quarterary); }
.tool.is-rec::before { content: ""; position: absolute; top: 5px; right: 5px; width: 7px; height: 7px; border-radius: 9999px; background: var(--ai-border); box-shadow: 0 0 0 2px var(--color-fg-primary); }
/* what is selected: the block, or "Block › its cards" — the block name takes you back up */
.tool-part { position: relative; display: inline-flex; align-items: center; gap: 2px; height: 28px; padding: 0 2px 0 10px; border-radius: 9999px; background: var(--color-fg-brand-tertiary); color: var(--color-text-brand-solid); font: 500 14px/20px var(--font-sans); white-space: nowrap; }
.tool-part > button { position: relative; width: 24px; height: 24px; display: grid; place-items: center; border: 0; border-radius: 9999px; background: none; color: inherit; cursor: pointer; }
.tool-part > button:hover { background: var(--color-fg-primary); }
.tool-part svg { width: 12px; height: 12px; }
.tool-part .tool-up { position: relative; width: auto; height: auto; padding: 0; border: 0; background: none; font: inherit; color: var(--color-text-primary); cursor: pointer; }
.tool-part .tool-up:hover { text-decoration: underline; background: none; }
.tool-part .tool-crumb { margin: 0 4px; color: var(--color-text-tertiary); }
/* the tooltip — the kit's .ag-tooltip look, above the button (the bar sits at the bottom) */
.hub-tools [data-tip]::after { content: attr(data-tip); position: absolute; z-index: 50; left: 50%; bottom: calc(100% + 10px); transform: translateX(-50%);
  padding: 4px 8px; border-radius: var(--radius-md); background: #000000cc; color: var(--color-text-inverse); box-shadow: var(--shadow-md);   /* = .ag-tooltip */
  font: 500 12px/16px var(--font-sans); white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .12s ease; }
.hub-tools [data-tip]:hover::after, .hub-tools [data-tip]:focus-visible::after { opacity: 1; }
.hub-tools .dd:has(.dd__menu:not([hidden])) [data-tip]::after { display: none; }   /* no tooltip over an open menu */
/* the page picker: every page with a preview of it (Readymag's Pages as the reference) */
.pg-menu { width: 320px; max-height: min(560px, calc(100vh - 200px)); overflow: auto; }
.pg-item { display: flex; align-items: center; gap: 2px; border-radius: var(--radius-lg); }
.pg-item + .pg-item { margin-top: 2px; }
.pg-item:hover, .pg-item.is-cur { background: var(--color-fg-primary-alt); }
.pg-item__pick { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; padding: 6px; border: 0; border-radius: var(--radius-lg); background: none; text-align: left; cursor: pointer; font: inherit; }
.pg-thumb { width: 112px; height: 70px; flex-shrink: 0; overflow: hidden; border-radius: var(--radius-md); border: 1px solid var(--color-border-secondary); background: var(--color-fg-secondary); pointer-events: none; }
.pg-thumb .hub-frame { border-radius: 0; box-shadow: none; }
.pg-item__txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.pg-item__txt b { display: flex; align-items: center; gap: 6px; font: 500 14px/20px var(--font-sans); color: var(--color-text-primary); }
.pg-item__txt span { font: 400 12px/16px var(--font-sans); color: var(--color-text-tertiary); }
.pg-item.is-hidden .pg-thumb { opacity: .4; }
.pg-item.is-hidden .pg-item__txt b { color: var(--color-text-tertiary); }
.pg-dot { width: 7px; height: 7px; border-radius: 9999px; background: var(--color-fg-warning-solid); }
.eye { width: 30px; height: 30px; flex-shrink: 0; margin-right: 4px; border: 0; border-radius: var(--radius-md); background: transparent; color: var(--color-text-tertiary); display: grid; place-items: center; cursor: pointer; }
.eye:hover { background: var(--color-fg-primary); color: var(--color-text-primary); }
.eye svg { width: 16px; height: 16px; }
.dev-menu { width: 220px; }
/* Styles: the tags from onboarding (Daria, 26.09) — the same set and colours; tap one and the look follows */
.sty-menu { width: 380px; padding: 12px; left: 50%; transform: translateX(-50%); }   /* centred over its button, so it stays inside the canvas */
/* kit rules for a menu: group names — section label (10/15 caps), everything else — 14px medium; one left edge for all */
.sty-menu .text-section-label { padding: 0 0 8px; }
.sty-menu__sep { margin: 12px 0; border: 0; border-top: 1px solid var(--color-border-secondary); }
.sty-menu .tagcloud { justify-content: flex-start; gap: 6px; padding: 0; }
.sty-menu .tag, .sty-menu .tag.is-on { height: 32px; padding: 0 12px; font: 500 14px/20px var(--font-sans); }
.sty-menu__foot { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--color-border-secondary); }
/* next to what's selected: a small field to say what to change, the dice and the lock (Daria, 26.09) */
.ctx { position: absolute; z-index: 24; display: flex; align-items: center; gap: 2px; padding: 4px; width: 340px; border-radius: var(--radius-xl);
  border: 1px solid var(--color-border-secondary); background: var(--color-fg-primary); box-shadow: var(--shadow-lg); }
.ctx form { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; padding-left: 8px; }
.ctx form .ai-ico { width: 14px; height: 14px; flex-shrink: 0; }
.ctx input { flex: 1; min-width: 0; height: 32px; border: 0; outline: none; background: none; font: 400 14px/20px var(--font-sans); color: var(--color-text-primary); }
.ctx input::placeholder { color: var(--color-text-tertiary); }
/* the field: ready asks under it, one tap each (Daria, 28.09) */
.ctx { flex-wrap: wrap; }
.ctx__asks { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 4px 4px 8px; border-top: 1px solid var(--color-border-secondary); margin-top: 2px; }
.ctx__ask { height: 26px; padding: 0 10px; border-radius: 9999px; border: 1px solid var(--color-border-primary); background: var(--color-fg-primary); cursor: pointer;
  font: 500 12px/16px var(--font-sans); color: var(--color-text-primary); transition: background .12s, border-color .12s; }
.ctx__ask:hover { background: var(--color-fg-primary-hover); border-color: var(--color-fg-pink-secondary); }
.ctx.is-miss input::placeholder { color: var(--color-text-warning-solid); }
.ctx.is-miss { animation: ctx-miss .3s ease; }
@keyframes ctx-miss { 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
.ctx .tool { width: 32px; height: 32px; }
.ctx input:disabled { background: none; }
.ctx .tool[aria-disabled="true"] { color: var(--color-text-quarterary); cursor: default; background: none; }
/* + on Home: the blocks that aren't on the page, each with a preview in the hub's current look */
.add-menu { width: 340px; max-height: min(560px, calc(100vh - 200px)); overflow: auto; left: 50%; transform: translateX(-50%); }   /* centred over +, like Styles */
.add-menu .pg-thumb { height: 64px; }
.add-head { display: flex; align-items: center; gap: 8px; padding-right: 2px; }
.add-head .text-section-label { flex: 1; }
.add-rec { display: inline-flex; align-items: center; gap: 3px; margin-left: 8px; font: 500 12px/16px var(--font-sans); color: var(--ai-accent); vertical-align: 1px; }
.add-rec .ai-ico { width: 12px; height: 12px; }
/* a page with everything that sells: said as good news, not "nothing left" (Daria, 27.09) */
.add-done { display: flex; gap: 10px; align-items: flex-start; margin: 2px 2px 8px; padding: 10px 12px; border-radius: var(--radius-lg); background: var(--color-fg-success-tertiary, var(--color-fg-secondary)); }
.add-done > svg { width: 18px; height: 18px; flex-shrink: 0; margin-top: 1px; color: var(--color-text-success-primary); }
.add-done span { display: flex; flex-direction: column; gap: 2px; font: 400 14px/20px var(--font-sans); color: var(--color-text-secondary); }
.add-done b { font: 600 14px/20px var(--font-sans); color: var(--color-text-primary); }
.dev-menu .ag-menu__item svg { width: 18px; height: 18px; color: var(--color-text-tertiary); }

/* ---- hub page = the customer's game theme (raw colors allowed) ----
   Type is set for the real width of the page (Daria, 27.09: micro type looked cheap). A desktop page is 1280 wide and
   shown scaled down, so its type is a real website's — 16px body, big headings; a phone gets a phone's sizes.
   --hf text · --hp primary · --ha accent · --hs surface — set by the look on the frame. */
.hub-frame { --fs-body: 15px; --fs-small: 13px; --fs-name: 15px; --fs-price: 16px; --fs-kick: 12px; --fs-nav: 14px; --fs-sub: 22px; --fs-h: 30px; --fs-hero: 44px; --fs-btn: 14px; --btn-h: 38px; --btn-h-lg: 46px;
  position: relative; margin: 0 auto; border-radius: 10px; box-shadow: var(--shadow-xl); display: flex; flex-direction: column; padding-bottom: 28px;
  color: var(--hf); font: 400 var(--fs-body)/1.45 var(--font-sans); }
.hub-frame--desktop { --fs-body: 17px; --fs-small: 15px; --fs-name: 18px; --fs-price: 19px; --fs-kick: 14px; --fs-nav: 16px; --fs-sub: 30px; --fs-h: 44px; --fs-hero: 68px; --fs-btn: 16px; --btn-h: 46px; --btn-h-lg: 56px; }
.hub-frame--phone { --fs-body: 14px; --fs-small: 12px; --fs-name: 14px; --fs-price: 15px; --fs-kick: 11px; --fs-nav: 14px; --fs-sub: 20px; --fs-h: 24px; --fs-hero: 30px; --fs-btn: 14px; --btn-h: 36px; --btn-h-lg: 42px;
  border-radius: 22px; min-height: 740px; }
.hub-frame--tablet { min-height: 1024px; }
.hub-frame--phone, .hub-frame--tablet { box-shadow: 0 0 0 1px var(--color-border-secondary), var(--shadow-xl); }   /* a screen on the grey field: a hairline and a shadow show its edge */
.hub-frame.is-fill { flex: none; margin: 0; border-radius: 0; box-shadow: none; padding-bottom: 110px; }   /* the last row stays clear of the bar */
.hub-frame.is-fill .hub-head { border-radius: 0; }
.hub-mute { color: color-mix(in srgb, var(--hf) 64%, transparent); }
.hub-head { position: relative; height: 52px; display: flex; align-items: center; gap: 28px; padding: 0 var(--hd-pad); background: color-mix(in srgb, var(--hf) 5%, transparent);
  box-shadow: inset 0 -1px 0 color-mix(in srgb, var(--hf) 10%, transparent); border-radius: 10px 10px 0 0; }
.hub-frame--phone .hub-head { border-radius: 22px 22px 0 0; gap: 12px; }
.hub-head b { font-size: calc(var(--fs-nav) + 2px); line-height: 1; white-space: nowrap; }
.hub-head .nl { font-size: var(--fs-nav); font-weight: 500; color: color-mix(in srgb, var(--hf) 62%, transparent); white-space: nowrap; }
.hub-head .nl.is-cur { color: var(--hf); }
.hub-head > b, .hub-head__act { flex-shrink: 0; }
.hub-head__nav { display: flex; gap: 24px; min-width: 0; overflow: hidden; }   /* a wide font: the menu gives way, the buttons stay in */
.hub-head__gap { flex: 1; min-width: 0; }
.hub-head__act { display: flex; align-items: center; gap: 10px; }
.hub-burger { display: flex; flex-direction: column; gap: 4px; padding: 4px 0 4px 6px; }
.hub-burger i { width: 18px; height: 2px; border-radius: 2px; background: currentColor; }

.hbtn { height: var(--btn-h); padding: 0 18px; border-radius: 7px; font-size: var(--fs-btn); font-weight: 700; white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.hbtn--sm { height: calc(var(--btn-h) - 8px); padding: 0 14px; font-size: calc(var(--fs-btn) - 1px); }
.hbtn--ghost { color: var(--hf); box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--hf) 35%, transparent); background: transparent; }
.hub-sec { display: flex; flex-direction: column; gap: calc(var(--hd-gap) * 2 + 8px); padding: var(--hd-pad); }
.hub-block { position: relative; display: flex; flex-direction: column; gap: calc(var(--hd-gap) + 4px); }
.hub-h { font-size: var(--fs-h); line-height: 1.1; }
.hub-sub { font-size: var(--fs-sub); line-height: 1.15; }
.hub-text__p { margin: 0; max-width: 64ch; font-size: var(--fs-body); line-height: 1.55; }
.hub-text--card { padding: calc(var(--hd-pad) + 4px); }
/* the banner: text on the left, the art on the right; the art is drawn from the look (shapes, pattern, glow) */
.hero { position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: center; gap: 10px; padding: calc(var(--hd-pad) * 1.6); }
.hero__txt { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: flex-start; gap: 10px; max-width: 56%; }
.hero--split { flex-direction: row; align-items: stretch; gap: calc(var(--hd-gap) * 2); padding: calc(var(--hd-pad) * 1.2); }
.hero--split .hero__txt { flex: 1; justify-content: center; max-width: none; padding: calc(var(--hd-pad) * .6); }
.hero--split .hero__art { position: relative; width: 44%; flex-shrink: 0; overflow: hidden; }
.hero--band { flex-direction: row; align-items: center; justify-content: flex-start; gap: calc(var(--hd-gap) * 2); }
.hero--band .hero__txt { flex: 1; max-width: none; gap: 4px; }
.hero--band .hero__icon { width: 18%; max-width: 120px; aspect-ratio: 1; flex-shrink: 0; }
.hero small { font-size: var(--fs-kick); font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
.hero b { font-size: var(--fs-hero); line-height: 1.02; }
.hero--band b { font-size: calc(var(--fs-hero) * .6); }
.hero__sub { font-size: calc(var(--fs-body) + 1px); color: color-mix(in srgb, var(--hf) 78%, transparent); }
.hero .hbtn { margin-top: 8px; height: var(--btn-h-lg); padding: 0 26px; font-size: calc(var(--fs-btn) + 1px); }
.hero--band .hbtn { margin-top: 0; }
.hero__cluster { position: absolute; right: 5%; top: 50%; width: 36%; aspect-ratio: 1.25; transform: translateY(-50%); }
.hero--split .hero__cluster { right: 8%; left: 8%; width: auto; }
.hero__cluster > svg { position: absolute; }
.hero__cluster > svg:nth-child(1) { width: 58%; left: 20%; top: 16%; }
.hero__cluster > svg:nth-child(2) { width: 30%; right: 0; top: 0; }
.hero__cluster > svg:nth-child(3) { width: 26%; left: 0; bottom: 2%; }
/* item cards: the picture keeps its proportions whatever the width (Daria, 26.09 — it was stretching) */
.cards { display: grid; gap: var(--hd-gap); }
.cards--a-list { grid-template-columns: 1fr !important; }
.cards-group { display: flex; flex-direction: column; gap: 10px; }
.cards-group + .cards-group { margin-top: 10px; }
.cards-group__h { font-size: var(--fs-kick); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: color-mix(in srgb, var(--hf) 60%, transparent); }
.hcard__txt { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.hcard { position: relative; display: flex; flex-direction: column; gap: 12px; }
.hcard .art { position: relative; overflow: hidden; aspect-ratio: 5 / 4; display: grid; place-items: center; }
.hcard .art > svg { width: 46%; max-width: 150px; height: auto; }
.cards--big-cards .hcard .art { aspect-ratio: 4 / 3; }
.hcard .art.none { background: transparent; box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--hf) 22%, transparent); gap: 6px; align-content: center;
  font-size: var(--fs-small); color: color-mix(in srgb, var(--hf) 50%, transparent); }
.hcard .art.none svg { width: 28px; height: 28px; opacity: .7; }
.hcard .nm { font-size: var(--fs-name); font-weight: 600; line-height: 1.25; }
.hcard .sb { font-size: var(--fs-small); color: color-mix(in srgb, var(--hf) 62%, transparent); }
.hcard .nm .rib { position: static; display: inline-block; margin-left: 8px; vertical-align: 2px; }
.hcard .rib { position: absolute; top: 10px; left: 10px; padding: 3px 8px; border-radius: 5px; font-size: var(--fs-kick); font-weight: 800; letter-spacing: .04em; }
.hcard__row { display: flex; align-items: flex-end; gap: 10px; }
.hcard__row .hcard__txt { flex: 1; }
.hcard__price { font-size: var(--fs-price); font-weight: 800; white-space: nowrap; }
.hcard .hbtn { width: 100%; }
.hcard--s2 { text-align: center; }
.hcard--s2 .hcard__txt { align-items: center; }
.cards--a-list .hcard { flex-direction: row; align-items: center; gap: 16px; text-align: left; }
.cards--a-list .hcard .art { aspect-ratio: 1; flex-shrink: 0; }
.cards--a-list .hcard .art > svg { width: 60%; }
.cards--a-list .hcard .hcard__txt { flex: 1; min-width: 0; align-items: flex-start; }
.cards--a-list .hcard .hbtn { width: auto; }
.cards--a-list .hcard .hbtn, .cards--a-list .hcard__price { flex-shrink: 0; }
.cats { display: flex; flex-wrap: wrap; gap: 8px; } .cats span { height: calc(var(--btn-h) - 6px); padding: 0 16px; border-radius: 999px; font-size: var(--fs-small); font-weight: 600; display: flex; align-items: center; }
/* news */
.news2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--hd-gap); }
.newslist { display: flex; flex-direction: column; gap: var(--hd-gap); }
.ncard { display: flex; flex-direction: column; gap: 14px; }
.newslist .ncard { flex-direction: row; gap: 18px; align-items: center; }
.ncard__txt { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.ncard__t { font-size: calc(var(--fs-name) + 1px); font-weight: 600; line-height: 1.3; }
.ncard__d { font-size: var(--fs-small); color: color-mix(in srgb, var(--hf) 58%, transparent); }
.ncard .img { position: relative; overflow: hidden; flex-shrink: 0; display: grid; place-items: center; }
.ncard .img > svg { width: 22%; min-width: 34px; max-width: 72px; height: auto; }
.newslist .ncard .img { width: 30%; max-width: 220px; }
.kick { font-size: var(--fs-kick); font-weight: 700; letter-spacing: .08em; }
/* daily rewards: the layout is the block's, the tile is the card's */
.days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: var(--hd-gap); }
.days--grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.days--grid .day:last-child { grid-column: span 2; }   /* 4 + 3: day 7 takes the empty cell, no hole in the grid */
.days--spot { grid-template-columns: repeat(3, minmax(0, 1fr)) 1.4fr; }
.days--spot .day:last-child { grid-column: 4; grid-row: 1 / 3; height: auto; }
.day { position: relative; overflow: hidden; height: var(--hd-day, 110px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
  font-size: var(--fs-small); font-weight: 600; text-align: center; padding: 8px; }
.day__l { font-size: var(--fs-kick); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: color-mix(in srgb, var(--hf) 55%, transparent); }
.day > svg { width: 30%; max-width: 44px; height: auto; flex-shrink: 0; }
.day__n { font-size: calc(var(--fs-sub) * 1.2); line-height: 1; }
.day__stamp { width: 2.4em; height: 2.4em; flex-shrink: 0; border-radius: 9999px; border: 2px solid currentColor; display: grid; place-items: center; font-size: var(--fs-name); font-weight: 800; }
.days--spot .day:last-child > svg { width: 34%; max-width: 88px; }
.days--spot .day:last-child .day__n { font-size: calc(var(--fs-hero) * .8); }
.board { padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; }
.board__h { font-size: var(--fs-name); font-weight: 700; }
.board div { display: flex; gap: 14px; font-size: var(--fs-body); } .board div span:nth-child(2) { flex: 1; }
.board div span:nth-child(3) { color: color-mix(in srgb, var(--hf) 62%, transparent); font-variant-numeric: tabular-nums; }
/* the leaderboard block on Home: a table or a podium of the top 3 */
.podium { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--hd-gap); align-items: end; }
.podium div { padding: 18px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; font-size: var(--fs-body); font-weight: 600; }
.podium b { font-size: calc(var(--fs-h) * 1.1); line-height: 1; }
.podium small { font-size: var(--fs-small); font-weight: 400; color: color-mix(in srgb, var(--hf) 60%, transparent); }
.podium div:nth-child(2) { padding-top: 40px; }
.loginbox { width: 400px; margin: 24px auto; padding: 28px; display: flex; flex-direction: column; gap: 16px; }
.hub-frame--desktop .loginbox { width: 460px; }
.loginbox .fld { height: var(--btn-h); border-radius: 8px; background: color-mix(in srgb, var(--hf) 8%, transparent); color: color-mix(in srgb, var(--hf) 50%, transparent); display: flex; align-items: center; padding: 0 14px; }
.loginbox__hint { font-size: var(--fs-small); line-height: 1.5; color: color-mix(in srgb, var(--hf) 72%, transparent); }
.loginbox__pic { position: relative; overflow: hidden; height: 120px; border-radius: 8px; }
/* the same hub on a phone: one column where it has to be, the menu behind a burger */
.hub-frame--phone .hero__txt { max-width: 62%; }
.hub-frame--phone .hero__cluster { width: 40%; right: 2%; }
.hub-frame--phone .hero--split { flex-direction: column; }
.hub-frame--phone .hero--split .hero__art { order: -1; width: 100%; height: 110px; }
.hub-frame--phone .hero--band { flex-wrap: wrap; }
.hub-frame--phone .news2 { grid-template-columns: 1fr; }
.hub-frame--phone .newslist .ncard .img { width: 34%; }
/* seven days in a row on a phone: a strip that scrolls sideways, as game stores do — no hole in a grid */
.hub-frame--phone .days:not(.days--grid):not(.days--spot) { grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: 29%; overflow: hidden; }
.hub-frame--phone .days--grid, .hub-frame--phone .days--spot { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.hub-frame--phone .days--grid .day:last-child { grid-column: 1 / -1; }
.hub-frame--phone .days--spot .day:last-child { grid-column: 1 / -1; grid-row: auto; height: var(--hd-day, 110px); flex-direction: row; gap: 14px; }   /* the wide day 7 on a phone reads in one line */
.hub-frame--phone .days--spot .day:last-child > svg { width: 38px; }
.hub-frame--phone .days--spot .day:last-child .day__n { font-size: 30px; }
.hub-frame--phone .loginbox { width: auto; margin: 8px 0; padding: 20px; }
/* Selection on the canvas (dashboard UI), two levels like Figma (Daria, 26.09): the first click takes the whole
   block; once it's selected, a click on a card inside takes the cards — what you do then applies to all of them. */
.pick { cursor: pointer; }
.pick:hover { outline: 2px dashed var(--color-fg-brand-primary-hover); outline-offset: 8px; }   /* hover — clearly visible, with room round the block (Daria, 28.09) */
.pick.is-sel { outline: none; }   /* the border is its own layer (renderSel) */
/* the selection is a shining border (Daria, 28.09, after Magic UI's Shine Border): Newton's light blue, glowing, with a glint of
   his colours travelling round it; a little away from the block. It's its own layer over the canvas (renderSel), not part of
   the block — a banner or a reward tile clips what sticks out of it, and the border and the Newton mark were cut. */
.sel-ring { position: absolute; z-index: 23; pointer-events: none; padding: 3px;
  background: radial-gradient(transparent, transparent, var(--color-fg-pink-primary), var(--color-text-inverse), var(--color-fg-brand-primary-hover), transparent, transparent) 0 0 / 250% 250%,
    linear-gradient(var(--color-fg-brand-primary-hover), var(--color-fg-brand-primary-hover));
  -webkit-mask: linear-gradient(black 0 0) content-box, linear-gradient(black 0 0); -webkit-mask-composite: xor; mask-composite: exclude;
  filter: drop-shadow(0 0 6px var(--color-fg-brand-primary-hover)) drop-shadow(0 0 10px var(--color-fg-pink-primary));
  animation: hub-shine 4.5s linear infinite; }
.sel-ring__ai { position: absolute; z-index: 24; pointer-events: none; width: 24px; height: 24px; border-radius: 9999px; background: var(--color-fg-primary); box-shadow: var(--shadow-md); display: grid; place-items: center; }
.sel-ring__ai .ai-ico { width: 14px; height: 14px; }
#stage .sel-ai { display: none; }   /* the Newton mark rides on the border layer, where nothing cuts it */
@keyframes hub-shine { 0% { background-position: 0% 0%, 0 0; } 50% { background-position: 100% 100%, 0 0; } 100% { background-position: 0% 0%, 0 0; } }
@media (prefers-reduced-motion: reduce) { .sel-ring { animation: none; } }
.hub-head.pick:hover { outline-offset: -4px; }   /* the header touches the window's edge: the outline goes inside */
.hub-block.is-open [data-el$=":item"] { cursor: pointer; }
.hub-block.is-open [data-el$=":item"]:hover { outline: 1px dashed var(--color-border-brand); outline-offset: 2px; }
[data-el$=":item"].is-sel { outline: none; }
/* preview mode (?embed=desktop|phone): only the hub, edge to edge, nothing to click */
.is-embed .app__header, .is-embed .app__chat, .is-embed .hub-tools, .is-embed .ctx { display: none !important; }
.is-embed .app, .is-embed .app__body, .is-embed .app__pane { padding: 0; gap: 0; border-radius: 0; background: none; }
.is-embed .canvas, .is-embed .canvas--framed { padding: 0; overflow: hidden; }
.is-full .canvas, .is-full .canvas--framed { overflow: auto; }   /* the preview tab scrolls like the site */
.is-embed #stage { pointer-events: none; }
.is-embed .hub-frame, .is-embed .hub-frame--phone, .is-embed .hub-frame--phone .hub-head { border-radius: 0; box-shadow: none; }
.is-embed .hub-frame--phone { min-height: 100vh; }
/* dragging a block on Home (Daria, 27.09): it fades where it was, a line shows where it will land */
.hub-sec > .pick.is-sel:not(.is-kept) { cursor: grab; }
.hub-sec > .is-dragging { opacity: .35; }
.dropline { position: absolute; z-index: 26; height: 4px; border-radius: 4px; background: var(--color-fg-brand-primary); box-shadow: 0 0 0 3px color-mix(in srgb, var(--color-fg-brand-primary) 25%, transparent); pointer-events: none; }
.canvas.is-dragging, .canvas.is-dragging * { cursor: grabbing !important; user-select: none; }
.kept { position: absolute; top: 8px; right: 8px; z-index: 4; width: 22px; height: 22px; border-radius: 9999px; background: rgba(0, 0, 0, .45); color: #FFFFFF; display: grid; place-items: center; }
.kept svg { width: 12px; height: 12px; }

.draftbar span, .hero .draftbar span { flex: 1; color: var(--color-text-primary); }

<div class="app app--fixed">

</div>

<script src="app/app.js?v=96b59ef"></script>
<script src="app/chat.js?v=96b59ef"></script>

<script>
(() => {
  const { $, $$, icon, nwIcon } = AG;

  /* ---------- state of the editor (this page only) ---------- */
  const PAGES = [['home', 'Home', '/'], ['store', 'Store', '/store'], ['rewards', 'Daily rewards', '/daily-rewards'], ['news', 'News', '/news'], ['leaders', 'Leaderboards', '/leaderboards'], ['login', 'Login', '/login']];
  /* see the hub the way players will: it adapts, it isn't just scaled (Daria, 26.09).
     w — the width the page is laid out at. Desktop fills the window: 1280 scaled to fit, so its proportions hold;
     Phone and Tablet keep their real width on a dark field. */
  const DEVICES = { phone: { w: 375, label: 'Phone', icon: 'phone', note: '375' }, tablet: { w: 768, label: 'Tablet', icon: 'tablet', note: '768' }, desktop: { w: 1280, label: 'Desktop', icon: 'desktop', note: '1280', fill: true } };
  /* The look the dice rolls (handoff 5.4). Blocks and their cards (Daria, 26.09): a block has its layout
     (head, hero, cards, rewards, news), a card has its style (card, day, newsCard); group — store picks by category.
     Sizes: 1–5 steps; rows — how many rows of store picks (1–3); newsN — how many news on Home (2–4). */
  const LOOK0 = { accent: 'sales', pal: 0, font: 0, art: 0, bg: 0, deco: 0, surf: 0, btn: 0, rad: 10, hfx: 0, heroArt: 0, mono: 0, set: 0, head: 0, hero: 0, cards: 0, news: 0, rewards: 0, card: 0, day: 0, newsCard: 0, group: 0, leaders: 0, text: 0 };
  /* the blocks of Home, in order (Daria, 26.09): a block can be taken off with − and put back with + */
  const BLOCKS0 = ['hero', 'cards', 'rewards', 'news'];
  const HOME_BLOCKS = ['hero', 'cards', 'rewards', 'news', 'leaders'];
  /* Every page is a list of blocks (Daria, 27.09). A page's own block ('main': the store, the gifts, the news, the boards,
     the login form) stays; around it + adds the blocks that suit the page (FIT) — the universal ones (banner, text) and
     the others the page doesn't already have. REC — what sells best on the page: Newton marks it, Decide for me adds it. */
  const FIT = { home: ['hero', 'text', 'cards', 'rewards', 'news', 'leaders'], store: ['hero', 'text', 'rewards', 'leaders'], rewards: ['hero', 'text', 'cards', 'leaders'],
    news: ['hero', 'text', 'cards', 'rewards'], leaders: ['hero', 'text', 'cards', 'rewards'], login: ['hero', 'text'] };
  const REC = { home: ['hero', 'cards', 'rewards', 'news'], store: ['hero'], rewards: ['cards'], news: ['cards'], leaders: ['rewards'], login: ['text'] };
  const PAGE0 = { store: ['main'], rewards: ['main'], news: ['main'], leaders: ['main'], login: ['main'] };
  const MAIN_EL = { store: 'cards', rewards: 'rewards', news: 'news' };   // the page's own block as it's selected on the canvas
  const SIZES0 = { page: 3, header: 3, hero: 3, cards: 3, news: 3, rewards: 3, rows: 1, newsN: 2 };
  const RANGE = { rows: [1, 3], newsN: [2, 4] };
  const start = location.hash.slice(1);
  const H = {
    page: PAGES.some((p) => p[0] === start) ? start : 'home', sel: null, device: 'desktop',
    look: { ...LOOK0 },   // Newton has already decided — nothing to pick on arrival
    sizes: { ...SIZES0 },
    blocks: BLOCKS0.slice(),
    locks: {}, frozen: {}, past: [], future: [],   // a locked element keeps the look it had — the dice goes around it; past / future — Undo / Redo
    hero: 'base', heroSeed: 0, heroOffer: 0, artSeed: {}, quickStore: true,
    hidden: {}, cats: { Gems: true, Heroes: true, Chests: true, Energy: true }, boards: { b7: true, ball: true },
    pubArt: {}, loginText: '', edits: {}, changes: 0, pubDepth: 0, pageBlocks: JSON.parse(JSON.stringify(PAGE0)),
    fx: null   // where the magic plays after the next draw
  };
  /* the look survives leaving the mode: Newton switches to Hub mid-event and back */
  (() => { const k = AG.state.hub; if (k) { H.look = { ...LOOK0, ...k.look }; H.sizes = { ...SIZES0, ...k.sizes }; H.locks = k.locks || {}; H.frozen = k.frozen || {}; if (Array.isArray(k.blocks)) H.blocks = k.blocks; if (k.pageBlocks) H.pageBlocks = Object.assign(JSON.parse(JSON.stringify(PAGE0)), k.pageBlocks); if (DEVICES[k.device]) H.device = k.device; } })();
  /* a preview inside a laptop or a phone mock-up (onboarding, 27.09): Hub.html itself, only the hub page, no editor
     around it, nothing clickable, nothing saved — so the preview is always the real hub in the styles picked */
  const EMBED = new URLSearchParams(location.search).get('embed');
  if (EMBED) { H.device = DEVICES[EMBED] ? EMBED : 'desktop'; H.page = new URLSearchParams(location.search).get('page') || 'home'; document.documentElement.classList.add('is-embed'); }
  /* full=1: the preview tab — the whole page, scrolling, named like the hub */
  if (EMBED && new URLSearchParams(location.search).get('full')) { document.documentElement.classList.add('is-full'); document.title = 'Pixel Raiders · pixelraiders.aghanim.store'; }
  const keepLook = () => AG.save({ hub: { look: H.look, sizes: H.sizes, locks: H.locks, frozen: H.frozen, blocks: H.blocks, pageBlocks: H.pageBlocks, device: H.device } });
  /* the blocks of a page, in order: Home has its own list (H.blocks), every other page keeps 'main' in its list */
  const listOf = (p = H.page) => (p === 'home' ? H.blocks : H.pageBlocks[p] || ['main']);
  const setList = (list, p = H.page) => { if (p === 'home') H.blocks = list; else H.pageBlocks[p] = list; };
  const posOf = (id, p = H.page) => listOf(p).indexOf(id && MAIN_EL[p] === id ? 'main' : id);

  /* the look's palettes, fonts, grounds, cards, buttons and icons live in app/hub-skin.js (shared with the chat and the previews) */
  const { PALETTES, FONTS, ARTS, BGS, DECOS, SURFS, BTNS, HFX, HERO_ART, TAG_TRAITS, typeCss, hexA, shade, tint, svgUrl, decoBg, withDeco,
    bgCss, surf, hbtn, KIND, artSvg, rewardKind } = AG.skin;
  const CARD_NAME = ['cards in a row', 'big cards', 'a list'];
  const GAP = [8, 11, 14, 18, 22], PAD = [14, 17, 20, 24, 28], RAD = [4, 7, 10, 14, 18];
  const tagsNow = () => AG.style().tags;
  const anyOf = (list) => list[Math.floor(Math.random() * list.length)];
  /* the look from the tags (the rule — AG.skin.dealt): every tag on the list shows, the art goes to the tag picked last */
  const tagTraits = () => tagsNow().map((t) => TAG_TRAITS[t]).filter(Boolean);
  const dealt = () => AG.skin.dealt(tagsNow());
  const tagPals = () => AG.skin.tagPals(tagsNow());
  /* the look drawn by the tags: every trait, and the first palette they suit */
  const fitToStyles = (L) => {
    if (!tagTraits().length) return;   // no tags on: the hub keeps how it looks
    Object.assign(L, dealt());
  };
  if (!AG.state.hub || !AG.state.hub.look || AG.state.hub.look.btn == null) fitToStyles(H.look);

  /* what is being drawn right now: the canvas, or a page preview in the page picker */
  const V = { page: H.page, dev: H.device, thumb: false };

  /* a locked part reads its look from the snapshot taken when it was locked */
  const lookOf = (key) => { const f = H.frozen[key]; return f ? { look: { ...LOOK0, ...f.look }, sizes: { ...SIZES0, ...f.sizes } } : { look: H.look, sizes: H.sizes }; };
  const skinOf = (key) => AG.skin.skinFrom(lookOf(key).look);
  const palOf = (key) => skinOf(key).c;
  const sizeOf = (key, lead) => Math.min(5, lookOf(key).sizes[key] + (lead ? 1 : 0));
  const radOf = (key) => { const w = skinOf(key).w; return w.rad != null ? Math.round(w.rad * (desk() ? 1.2 : 1)) : RAD[lookOf(key).sizes.page - 1]; };   // the world's corners
  const fontOf = (key) => { const sk = skinOf(key), h = sk.w.head(sk.c); return `${typeCss(sk.t)}${h ? ';' + h : ''}`; };
  const col = () => PALETTES[H.look.pal % PALETTES.length];
  const phone = () => V.dev === 'phone';
  const desk = () => V.dev === 'desktop';

  const NO_IMG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="m3 16 5-5 4 4 3-3 6 6"/><circle cx="15.5" cy="9" r="1.5"/></svg>';
  const OFFERS = [{ title: 'Starter Pack', sub: '500 gems · 3 hero shards', price: '$4.99', kicker: 'LIMITED OFFER' }, { title: 'Gem Hoard', sub: '1,200 gems · 2 hero shards', price: '$9.99', kicker: 'BEST VALUE' }];
  const HERO_BG = { base: ['#3A2A7A', '#24406A', '#5A2A6A'], hw: ['#4A1F0E', '#2B1A3D', '#3D2308'] };
  // News: only from real sources. Newton writes from App Store "What's new", never invents events (handoff 6.6)
  const ARTICLES = [
    { id: 'a1', title: 'Season 3 patch notes', cat: 'Update', src: 'RSS · game site', pub: true, date: 'Sep 20' },
    { id: 'a2', title: 'Guild wars weekend', cat: 'Event', src: 'Discord', pub: true, date: 'Sep 18' },
    { id: 'a4', title: 'New hero: Frost Warden', cat: 'Update', src: 'App Store notes', newton: true, date: 'Sep 24' },
    { id: 'a7', title: 'Arena 9 is open', cat: 'Update', src: 'App Store notes', newton: true, date: 'Sep 16' },
    { id: 'a8', title: 'Faster matchmaking', cat: 'Update', src: 'App Store notes', newton: true, date: 'Sep 9' },
    { id: 'a9', title: 'Bug fixes and stability', cat: 'Update', src: 'App Store notes', newton: true, date: 'Sep 2' },
    { id: 'a5', title: 'Community art contest winners', cat: 'Community', src: 'Discord', pub: true, date: 'Sep 12' },
    { id: 'a6', title: 'Autumn login bonus', cat: 'Event', src: 'You', date: '' }
  ];
  const isPub = (a) => a.pub || H.pubArt[a.id] || (a.newton && AG.state.published);
  const BOARDS = [['b7', 'Most played last 7 days'], ['ball', 'Most played overall']];
  const PLAYERS = [['1', 'NightRaven', '12,480'], ['2', 'Kira_07', '11,902'], ['3', 'MadGolem', '10,355']];
  const LOGIN_SUGGEST = 'Open Pixel Raiders, tap your avatar in the top-left corner. Your Player ID is the 9-digit number under your name.';
  /* the same 7 days as Dashboard → Daily rewards: day 7 follows what was done there (the Gold Chest, or its replacement) */
  const REWARDS_OF = () => ['50 gems', '100 energy', '100 gems', '1 hero shard', '150 gems', '200 energy',
    AG.state.applied.day7 ? 'Legendary Shard' : AG.state.applied.day7gems ? '500 gems' : 'Gold Chest'];

  /* ---------- selection: a block ('cards', 'rewards', 'news', 'hero', 'header') or its cards ('cards:item' …) ---------- */
  const selId = () => (!V.thumb ? H.sel : null);
  const blockOf = (id) => (id ? id.split(':')[0] : null);
  const isItems = (id) => !!id && id.endsWith(':item');
  const blockCls = (k) => { const s = selId(); return `pick${s === k ? ' is-sel' : ''}${s === k || s === k + ':item' ? ' is-open' : ''}`; };
  const itemCls = (k) => (selId() === k + ':item' ? ' is-sel' : '');
  // Newton's mark: shown on a selected block only while it is fully generated (handoff 6.8)
  const genByNewton = (id) => (H.edits[id] ? false : id === 'hero' ? AG.byNewton('offer') : true);
  /* unpublished changes; pubDepth — where the history stood at the last publish, so Undo back to it counts down, not up */
  const changed = (n = 1) => { H.changes = Math.max(0, H.changes + n); };

  /* ---------- header ---------- */
  function renderHeader() {
    const can = AG.canPublish(), pub = AG.state.published;
    /* the publish state, quietly (Daria, 27.09): unpublished changes come with the reassurance that nothing is live yet */
    const note = !can ? 'Publishing opens once the problems are fixed' : !pub ? 'Not live yet · only you see it' : H.changes ? `${H.changes} change${H.changes > 1 ? 's' : ''} · live once you publish` : 'All changes are live';
    AG.mountHeader('hub', '',
      `<span class="hdr-note">${note}</span>
       <div class="hdr-bar">
         <button class="ag-btn ag-btn--outline" data-h="preview">${icon('play')}Preview</button>
         <button class="ag-btn ag-btn--primary" data-h="publish" ${can && (!pub || H.changes) ? '' : 'disabled'} title="${can ? '' : AG.publishBlocker()}">Publish</button>
       </div>`);
    const h = $('#app-header');
    /* Preview: this page on this device, as players see it — no selection, no bar, nothing to click (Daria, 27.09) */
    /* Preview (Daria, 27.09): the hub in a tab of its own, full size, as a player opens it (clicks inside come later) */
    h.querySelector('[data-h="preview"]').addEventListener('click', () => { keepLook(); window.open(`Hub.html?embed=${H.device}&page=${H.page}&full=1`, '_blank'); });
    h.querySelector('[data-h="publish"]').addEventListener('click', () => { H.changes = 0; H.pubDepth = H.past.length; AG.save({ published: true }); AG.newton.published(); });
  }

  /* ---------- the bar at the bottom: which page, which device (Daria, 26.09 — instead of the page list) ---------- */
  const storeFlag = () => AG.items.some((i) => !AG.hasImage(i) || !i.sku);   // items without an image or not linked to the game
  function pagesMenu() {
    const keep = { ...V };
    const rows = PAGES.map(([k, l, url], i) => {
      Object.assign(V, { page: k, dev: 'desktop', thumb: true });
      const frame = frameHTML();
      return `<div class="pg-item${H.page === k ? ' is-cur' : ''}${H.hidden[k] ? ' is-hidden' : ''}">

    const sty = t.closest('[data-sty]'); if (sty) { toggleStyle(sty.dataset.sty); return; }
    const qa = t.closest('[data-ctx-ask]'); if (qa) { const ask = resolve(qa.dataset.ctxAsk); if (!ask || onLook({ ask }) == null) { ctxMiss = true; renderCtx(); } return; }   // a ready ask under the field — the same as typing it
    const ad = t.closest('[data-add]'); if (ad) { AG.closeMenus(); addBlock(ad.dataset.add); return; }
    if (t.closest('[data-add-decide]')) { AG.closeMenus(); decideBlocks(); return; }
    if (t.closest('.dd')) return;
    const tl = t.closest('[data-tool]');
    if (tl) {
      if (tl.getAttribute('aria-disabled') === 'true') return;
      const a = tl.dataset.tool;
      if (a === 'deselect') select(null);
      else if (a === 'up') select(blockOf(H.sel));
      else if (a === 'roll') onLook({ ask: 'another look' });
      else onLook({ ask: a });   // undo, redo
      return;
    }
    /* the field next to the element: its dice and lock */
    const cx = t.closest('[data-ctx]');
    if (cx) {
      const b = blockOf(H.sel);
      if (cx.getAttribute('aria-disabled') === 'true') return;
      if (cx.dataset.ctx === 'remove') { removeBlock(b); return; }
      if (cx.dataset.ctx === 'dice') onLook({ ask: isItems(H.sel) ? (b === 'rewards' ? 'another tile style' : 'another card style') : 'change layout' });
      else onLook({ ask: H.locks[b] ? 'let it change again' : 'keep this one' });
      return;
    }
    if (t.closest('#ctx')) return;
    const c = t.closest('[data-chip]'); if (c) { e.stopPropagation(); chip(c.dataset.chip); return; }
    /* two levels (Daria, 26.09): a click in a block takes the block; with the block selected, a click on a card
       takes its cards (all of them — they share one look) */
    const el = t.closest('[data-el]');
    if (el) {
      const k = el.dataset.el;
      if (isItems(k)) { const b = blockOf(k); select(H.sel === b || H.sel === k ? k : b); }
      else select(k);
      return;
    }
    const h = t.closest('[data-h]');
    if (h && h.dataset.h === 'canvas') select(null);
  });
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if ($('.dd__menu:not([hidden])')) { AG.closeMenus(); return; }
    if (H.sel && (!e.target.closest('input, textarea') || e.target.closest('#ctx'))) select(isItems(H.sel) ? blockOf(H.sel) : null);   // Esc — one level up
  });
  /* the field next to the element: plain words → the change, right there with the magic */
  document.addEventListener('submit', (e) => {
    if (!e.target.matches('[data-ctx-form]')) return;
    e.preventDefault();
    const text = $('[data-ctx-in]').value, ask = resolve(text);
    if (!ask) { ctxMiss = true; renderCtx(); $('[data-ctx-in]').focus(); return; }
    if (onLook({ ask }) == null) { ctxMiss = true; renderCtx(); }
    const i = $('[data-ctx-in]'); if (i) i.focus({ preventScroll: true });
  });
  document.addEventListener('ag:change', render);
  window.addEventListener('hashchange', () => { const p = location.hash.slice(1); if (PAGES.some((x) => x[0] === p)) AG.swap(() => { H.page = p; select(null); AG.newton.refresh('visit'); }, $('#stage')); });
  if (window.ResizeObserver) new ResizeObserver(() => { fit(); renderCtx(); }).observe($('#canvas'));
  render();
  /* the look's fonts arrive after the first draw: once they are in, the page is measured again (the field sits on its block) */
  if (document.fonts) document.fonts.addEventListener('loadingdone', () => { fit(); renderCtx(); });
  if (!EMBED) AG.newton.mount({ page: 'hub', hubPage: () => H.page, advice: adviceMsg, look: () => ({ keys: ALL_ASKS }), onLook, did: () => lastDid, settings: settingsMsg, onSetting });   // look: what a typed request can ask for
})();
</script>
